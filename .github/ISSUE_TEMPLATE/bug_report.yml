name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. A good report includes what you did, what you expected, and what actually happened — that's usually enough to get started.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug. Screenshots or logs are welcome.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal sequence that triggers the bug.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Version, OS, browser, runtime — whatever is relevant.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / console output
      description: Paste any relevant logs, console errors, or failures.
      render: shell
    validations:
      required: false
